  var h='<svg viewBox="0 0 150 92"><defs><linearGradient id="lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7b8"/><stop offset="1" stop-color="#9c7431"/></linearGradient></defs>';
  [1,-1].forEach(function(m){var P0=[75+m*20,88],P1=[75+m*70,74],P2=[75+m*50,10];
    var pt=function(t){return [(1-t)*(1-t)*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0],(1-t)*(1-t)*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1]];};
    var tg=function(t){return [2*(1-t)*(P1[0]-P0[0])+2*t*(P2[0]-P1[0]),2*(1-t)*(P1[1]-P0[1])+2*t*(P2[1]-P1[1])];};
    h+='<path d="M'+P0+' Q'+P1+' '+P2+'" stroke="url(#lf)" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    for(var k=0;k<6;k++){var t=.12+k*.15,q=pt(t),d=tg(t),a=Math.atan2(d[1],d[0])*180/Math.PI,L=13*(1-k*.06);
      [-1,1].forEach(function(sd){var ang=a+sd*42,cx=q[0]+Math.cos(ang*Math.PI/180)*L*.55,cy=q[1]+Math.sin(ang*Math.PI/180)*L*.55;
        h+='<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+(L*.62).toFixed(1)+'" ry="'+(L*.24).toFixed(1)+'" fill="url(#lf)" transform="rotate('+ang.toFixed(1)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')"/>';});}
  });
  return h+'</svg>';
})();
var D={};             // מסמך המשוב מהענן
var S={stars:0,tags:[],text:'',cb:true,pub:false,photo:false};
var DK='ysrv:'+rid;   // טיוטה מקומית — אם הלקוח יוצא באמצע

function show(html){$('loading').hidden=true;var v=$('view');v.hidden=false;v.innerHTML=html;}
function firstName(n){n=String(n||'').trim();return n;}
function waYehuda(text){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(text);}
function summaryText(){
  var t='משוב על העבודה'+(D.project?' ('+D.project+')':'')+' — '+(D.client||'')+'\n'+'★'.repeat(S.stars)+'☆'.repeat(5-S.stars);
  if(S.tags.length)t+='\n'+S.tags.join(' · ');
  if(S.text.trim())t+='\n'+S.text.trim();
  if(S.stars&&S.stars<=3&&S.cb)t+='\nאשמח שתחזור אליי 🙏';
  return t;
}

/* ===== טופס ===== */
function formView(){
  var nm=firstName(D.client);
  var h='<h1><span class="gt">'+(nm?'שלום '+esc(nm):'שלום')+'</span> 👋</h1>'+
    '<p class="sub">תודה שבחרתם בנו! איך היינו?</p>'+
    (D.project?'<div style="text-align:center"><span class="proj">🏠 '+esc(D.project)+'</span></div>':'')+
    '<div class="card">'+
      '<div class="wreath" aria-hidden="true">'+WREATH+'<div class="face" id="face">'+FACES[S.stars]+'</div></div>'+
      '<div class="stars" role="radiogroup" aria-label="דירוג מ-1 עד 5 כוכבים" id="stars">'+
        [1,2,3,4,5].map(function(i){return '<button type="button" class="st" role="radio" aria-checked="false" aria-label="'+i+' כוכבים" data-s="'+i+'">'+STAR+'</button>';}).join('')+
      '</div>'+
      '<div class="lbl" id="lbl">'+LBLS[S.stars]+'</div>'+
      '<div class="hint" id="hint">30 שניות · יהודה קורא כל משוב אישית</div>'+
      '<div class="more" id="more"><div>'+
        '<div class="q" id="tq"></div><div class="chips" id="chips"></div>'+
        '<div class="q" id="xq"></div>'+
        '<div class="tx"><textarea id="tx" maxlength="1200"></textarea>'+
          '<button type="button" class="mic" id="mic" hidden>'+I.mic+'<span>הקלטה בקול</span></button></div>'+
        '<label class="tog cb" id="cbw" hidden><input type="checkbox" id="cb"><span class="sw"></span><span><b>אשמח שיהודה יחזור אליי</b><small>הבקשה מגיעה ישירות לטלפון של יהודה</small></span></label>'+
        '<label class="tog" id="pubw" hidden><input type="checkbox" id="pub"><span class="sw"></span><span><b>מאשר/ת להציג את המשוב באתר</b><small>בשם פרטי בלבד — עוזר לאחרים לבחור</small></span></label>'+
        '<label class="tog"><input type="checkbox" id="photo"><span class="sw"></span><span><b>מאשר/ת פרסום תמונות מהפרויקט 📸</b><small>תמונות "לפני / אחרי" — ללא פרטים אישיים וללא כתובת</small></span></label>'+
        '<button type="button" class="send" id="send">שליחת המשוב</button>'+
        '<div class="err" id="err"></div>'+
      '</div></div>'+
    '</div>';
  show(h);bindForm();
}
function paintStars(bump){
  var box=$('stars');if(!box)return;
  [].forEach.call(box.querySelectorAll('.st'),function(b,i){var on=i<S.stars;b.classList.toggle('on',on);b.setAttribute('aria-checked',String(i+1===S.stars));
    if(bump&&on){b.classList.remove('bump');void b.offsetWidth;setTimeout(function(){b.classList.add('bump');setTimeout(function(){b.classList.remove('bump');},260);},i*55);}});
  var f=$('face');if(f){f.textContent=FACES[S.stars];if(bump){f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');setTimeout(function(){f.classList.remove('pop');},350);}}
  var l=$('lbl');if(l){l.textContent=LBLS[S.stars];l.classList.toggle('set',S.stars>0);}
  document.body.classList.toggle('happy',S.stars>=4);
}
function paintMore(){
  if(!S.stars)return;
  var good=S.stars>=4;
  $('more').classList.add('open');$('hint').hidden=true;
  $('tq').textContent=good?'מה הכי אהבתם? (אפשר כמה)':'מה היה צריך להיות אחרת?';
  $('xq').textContent=good?'רוצים להוסיף כמה מילים?':'ספרו לנו — נשמח לתקן';
  $('tx').placeholder=good?'למשל: עבודה נקייה, עמדו בזמנים, יחס מעולה…':'מה קרה? מה אפשר לעשות כדי לתקן?';
  var list=good?POS:NEG;
  S.tags=S.tags.filter(function(t){return list.indexOf(t)>=0;});
  var c=$('chips');c.className='chips'+(good?'':' neg');
  c.innerHTML=list.map(function(t){return '<button type="button" class="chip" aria-pressed="'+(S.tags.indexOf(t)>=0)+'">'+esc(t)+'</button>';}).join('');
  $('cbw').hidden=good;$('pubw').hidden=!good;
}
function bindForm(){
  var box=$('stars');
  box.addEventListener('click',function(e){var b=e.target.closest('.st');if(!b)return;var n=+b.dataset.s;var was=S.stars;S.stars=n;buzz(n>=4?[12,30,12]:12);paintStars(true);paintMore();saveDraft();
    if(!was)setTimeout(function(){try{$('more').scrollIntoView({behavior:'smooth',block:'start'});}catch(x){}},380);});
  box.addEventListener('keydown',function(e){var k=e.key;if(k!=='ArrowLeft'&&k!=='ArrowRight')return;e.preventDefault();var n=Math.max(1,Math.min(5,(S.stars||0)+(k==='ArrowRight'?1:-1)));S.stars=n;paintStars(true);paintMore();box.querySelectorAll('.st')[n-1].focus();});
  $('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;var t=b.textContent;var i=S.tags.indexOf(t);if(i>=0)S.tags.splice(i,1);else S.tags.push(t);b.setAttribute('aria-pressed',String(i<0));buzz(8);saveDraft();});
  var tx=$('tx');tx.value=S.text;tx.addEventListener('input',function(){S.text=tx.value;saveDraft();});
  var cb=$('cb'),pub=$('pub'),ph=$('photo');cb.checked=S.cb;pub.checked=S.pub;ph.checked=S.photo;
  cb.onchange=function(){S.cb=cb.checked;saveDraft();};pub.onchange=function(){S.pub=pub.checked;saveDraft();};ph.onchange=function(){S.photo=ph.checked;saveDraft();};
  bindMic();
  $('send').onclick=submit;
  paintStars(false);paintMore();
}
/* הקלטה בקול — אם הדפדפן תומך (כרום באנדרואיד) */
function bindMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;var m=$('mic');if(!SR||!m)return;m.hidden=false;
  var rec=null,on=false,base='';
  m.onclick=function(){
    if(on){try{rec.stop();}catch(e){}return;}
    try{rec=new SR();}catch(e){toast('ההקלטה לא זמינה במכשיר הזה');return;}
    rec.lang='he-IL';rec.interimResults=true;rec.continuous=true;
    var tx=$('tx');base=tx.value?tx.value.replace(/\s*$/,' '):'';
    rec.onresult=function(ev){var s='';for(var i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;tx.value=base+s;S.text=tx.value;};
    rec.onerror=function(ev){if(ev.error==='not-allowed')toast('צריך לאשר גישה למיקרופון');};
    rec.onend=function(){on=false;m.classList.remove('rec');m.querySelector('span').textContent='הקלטה בקול';saveDraft();};
    try{rec.start();on=true;m.classList.add('rec');m.querySelector('span').textContent='מקליט… לחצו לסיום';buzz(15);}catch(e){toast('ההקלטה לא זמינה כרגע');}
  };
}
function saveDraft(){lsSet(DK,{stars:S.stars,tags:S.tags,text:S.text,cb:S.cb,pub:S.pub,photo:S.photo,at:Date.now()});}

/* ===== שליחה ===== */
function submit(){
  var err=$('err');err.textContent='';
  if(!S.stars){err.textContent='בחרו דירוג בכוכבים כדי לשלוח';buzz([20,40,20]);return;}
  var b=$('send');b.disabled=true;b.textContent='שולח…';
  var good=S.stars>=4;
  var up={stars:S.stars,text:S.text.trim().slice(0,1200),tags:S.tags.slice(0,10),photoConsent:!!S.photo,publicOK:good&&!!S.pub,callback:!good&&!!S.cb,doneAt:Date.now()};
  if(D.doneAt)up.edits=(+D.edits||0)+1;
  var done=function(){D=Object.assign({},D,up);lsSet(DK,null);notify(up);thanks(true);};
  if(!db||!rid){fail();return;}
  var t=setTimeout(function(){fail();},12000),fin=false;
  db.collection('reviews').doc(rid).update(up).then(function(){if(fin)return;fin=true;clearTimeout(t);done();},function(){if(fin)return;fin=true;clearTimeout(t);fail();});
  function fail(){fin=true;b.disabled=false;b.textContent='שליחת המשוב';
    err.innerHTML='לא הצלחנו לשמור כרגע. <a href="'+waYehuda(summaryText())+'" target="_blank" rel="noopener" style="color:#fff;font-weight:800">שלחו את המשוב ליהודה בוואטסאפ ←</a>';}
}
/* התראה לטלפון של יהודה (אם הפעיל התראות כשיצר את הלינק) */
function notify(up){try{
  var subs=Array.isArray(D.push)?D.push.slice(0,5):[];if(!subs.length)return;
  var fn=String(D.pushFn||PUB).replace(/\/+$/,'');
  var body=JSON.stringify({subs:subs,ev:'review',cn:D.client||'',no:rid,n:up.stars,cb:up.callback?1:0,txt:(up.text||up.tags.join(' · ')).slice(0,120)});
  fetch(fn+'/api/notify',{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'text/plain;charset=UTF-8'}}).catch(function(){});
}catch(e){}}

/* ===== מסך תודה — חכם לפי הדירוג ===== */
function thanks(fresh){
  var n=+D.stars||0,good=n>=4,gmb=/^https:\/\//.test(String(D.gmb||''))?D.gmb:'';
  var nm=firstName(D.client);
  var h='<div class="card done">'+
    '<div class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
    '<h2><span class="gt">'+(fresh?'תודה'+(nm?' '+esc(nm):'')+'!':'המשוב שלך התקבל')+'</span></h2>'+
    '<div class="mine" aria-label="'+n+' כוכבים">'+'★'.repeat(n)+'<span style="color:#3a3a42">'+'★'.repeat(5-n)+'</span></div>'+
    '<p>'+(good?'שימחת אותנו מאוד 🙏':(D.callback?'יהודה קיבל את הפנייה ויחזור אליך בהקדם':'קיבלנו, ונעבוד להשתפר'))+'</p>'+
    ((D.tags&&D.tags.length)||D.text?'<div class="quote">'+esc([(D.tags||[]).join(' · '),D.text||''].filter(Boolean).join('\n'))+'</div>':'')+
    '<div class="acts">'+
      (good&&gmb?'<a class="btn g" id="gbtn" href="'+esc(gmb)+'" target="_blank" rel="noopener">'+I.g+'<span>ביקורת בגוגל — 10 שניות<small>'+(D.text?'הטקסט שלך יועתק — רק להדביק':'זה עוזר לנו יותר מכל פרסומת')+'</small></span></a>':'')+
      (good?'<a class="btn wa" id="refer" href="#" target="_blank" rel="noopener">'+I.wa+'ממליצים לחבר בוואטסאפ</a>':
             '<a class="btn wa" href="'+waYehuda('שלום יהודה, לגבי המשוב ששלחתי'+(D.project?' על '+D.project:'')+':\n')+'" target="_blank" rel="noopener">'+I.wa+'לדבר עם יהודה בוואטסאפ</a>')+
      '<div class="row2">'+
        '<a class="btn" href="yehuda.vcf" download="יהודה שיפוצים.vcf" id="vcf">'+I.user+'שמירה בטלפון</a>'+
        (good?'<a class="btn" href="'+CARD+'" target="_blank" rel="noopener">'+I.share+'כרטיס הביקור</a>':'<a class="btn" href="tel:+972545718316">'+I.phone+'חיוג ליהודה</a>')+
      '</div>'+
      '<button type="button" class="btn ghost" id="edit">'+I.edit+'עדכון המשוב</button>'+
    '</div></div>';
  show(h);
  var g=$('gbtn');if(g)g.addEventListener('click',function(){var t=String(D.text||'').trim();if(t){try{navigator.clipboard.writeText(t).then(function(){toast('המשוב שלך הועתק ✓ — הדביקו בגוגל');},function(){});}catch(e){}}});
  var r=$('refer');if(r){var msg='ממליץ/ה בחום על יהודה שיפוצים 👷‍♂️\nעבודה מקצועית ויחס אישי'+((D.tags&&D.tags.length)?' — '+D.tags.slice(0,3).join(', '):'')+'.\nקבלן רשום 134094 · 054-5718316\n'+CARD;
    r.href='https://wa.me/?text='+encodeURIComponent(msg);}
  $('vcf').addEventListener('click',function(){setTimeout(function(){toast('פתחו את הקובץ שירד ← "שמור"');},300);});
  $('edit').onclick=function(){S={stars:n,tags:(D.tags||[]).slice(),text:D.text||'',cb:D.callback!==false,pub:!!D.publicOK,photo:!!D.photoConsent};formView();window.scrollTo({top:0,behavior:'smooth'});};
  if(fresh){buzz([15,40,15,40,30]);if(good)confetti();window.scrollTo({top:0,behavior:'smooth'});}
}

/* ===== קונפטי (ללא ספריות) ===== */
function confetti(){
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  var c=$('fx'),x=c.getContext('2d');if(!x)return;var dpr=Math.min(2,window.devicePixelRatio||1);
  var W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  var cols=['#f6e7b8','#d4b36a','#b8924a','#8a6a2e','#ffffff','#e2c47e'],P=[];
  for(var i=0;i<150;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.32,vx:(Math.random()-.5)*16*dpr,vy:(-Math.random()*15-5)*dpr,s:(Math.random()*7+4)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],star:i%7===0});
  var t0=performance.now();
  (function f(t){var k=(t-t0)/1000;x.clearRect(0,0,W,H);
    P.forEach(function(p){p.vy+=.42*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-k/3.2);x.fillStyle=p.c;
      if(p.star){x.font=(p.s*2.2)+'px sans-serif';x.fillText('★',-p.s,p.s);}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(k<3.3)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})(t0);
}

/* ===== טעינה ===== */
function notFound(){show('<div class="card done"><h2>הלינק לא נמצא</h2><p>אולי הוא ישן או הועתק חלקית.</p><div class="acts"><a class="btn wa" href="'+waYehuda('שלום יהודה, ניסיתי לפתוח את לינק המשוב ולא הצלחתי')+'" target="_blank" rel="noopener">'+I.wa+'כתבו ליהודה בוואטסאפ</a></div></div>');}
function offline(){show('<div class="card done"><h2>אין חיבור כרגע</h2><p>בדקו את האינטרנט ונסו שוב.</p><div class="acts"><button type="button" class="btn" onclick="location.reload()">נסו שוב</button><a class="btn wa" href="'+waYehuda('שלום יהודה, רציתי להשאיר משוב')+'" target="_blank" rel="noopener">'+I.wa+'או כתבו ליהודה בוואטסאפ</a></div></div>');}
function start(){
  if(!rid){notFound();return;}
  if(!db){offline();return;}
  var to=setTimeout(offline,15000);
  db.collection('reviews').doc(rid).get().then(function(doc){clearTimeout(to);
    if(!doc.exists){notFound();return;}
    D=doc.data()||{};
    // נפתח לראשונה — יהודה רואה "נפתח" ברשימת המשובים
    if(!D.openedAt){try{db.collection('reviews').doc(rid).update({openedAt:Date.now()}).catch(function(){});}catch(e){}}
    if(D.doneAt){thanks(false);return;}
    var dr=lsGet(DK);if(dr&&typeof dr==='object'){S=Object.assign(S,dr);}
    formView();
  },function(){clearTimeout(to);offline();});
}
start();
window.__ysReview={S:function(){return S;},D:function(){return D;}};
})();
</script>
